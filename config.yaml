---
name: "JK-BMS wired management (fork Xander2980)"
version: 4.4.1
slug: "smartphoton_jkbms"
description: JK-BMS Management via RS485 & CAN bus or TCP/IP Gateway
url: https://github.com/Xander2980/jkbms-rs485-addon
ingress: false
ingress_stream: false
panel_icon: mdi:sitemap
init: false
homeassistant: 2025.10.1
arch:
  - aarch64
  - amd64
privileged:
  - NET_ADMIN
ports:
  "1891/tcp": 1891
ports_description:
  "1891/tcp": Web interface
hassio_api: true
homeassistant_api: true
host_network: true
uart: true
map:
  - type: homeassistant_config
    read_only: false
    path: /config

options:
  # JK-BMS Configuration
  jkbms_path: "/dev/serial/by-id/usb-xxxx_USB_Serial-abcdefghij"
  jkbms_count: 1
  use_gateway: false
  gateway_ip_port: "192.168.1.100:5000"
  communication_debug: false
  bms_broadcasting: false
  non_broadcasting_data_interval_s: 3
  CAN_bus_usage: false

  # MQTT Configuration
  mqttadresse_port: "core-mosquitto.local.hass.io:1883"
  mqttuser: "username"
  mqttpass: "password"

  # Telemetry
  Send_bip: false

  # Language of the Home Assistant entity names (de / en / fr)
  dashboard_language: "en"
  # Create a Home Assistant dashboard "JK-BMS" with the JK-BMS card
  create_dashboard: false

schema:
  # JK-BMS Configuration
  jkbms_path: str
  jkbms_count: int(1,15)?
  use_gateway: bool
  gateway_ip_port: str?
  communication_debug: bool
  bms_broadcasting: bool
  non_broadcasting_data_interval_s: float(1,30)
  CAN_bus_usage: bool

  # MQTT Configuration
  mqttadresse_port: str?
  mqttuser: str?
  mqttpass: password?

  # Login of the Node-RED editor / built-in dashboard (user "pi").
  # Empty = a password is generated once and shown in the add-on log.
  editor_password: password?

  dashboard_language: list(de|en|fr)
  create_dashboard: bool

  # Telemetry
  Send_bip: bool
